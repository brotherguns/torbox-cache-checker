services:
  checker:
    image: denoland/deno:2.1.4
    container_name: torbox-checker
    working_dir: /app
    command: ["deno", "run", "--allow-net", "--allow-read", "--allow-env", "main.ts"]
    environment:
      - PORT=8000
    volumes:
      - ./main.ts:/app/main.ts:ro
      - ./index.html:/app/index.html:ro
    ports:
      - "3000:8000"
    restart: unless-stopped
